services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SUPABASE_JDBC_URL: ${SUPABASE_JDBC_URL:?Set SUPABASE_JDBC_URL in .env}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME:?Set SUPABASE_DB_USERNAME in .env}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-123456789}
      CORS_ORIGIN: http://localhost:3000
      AI_MODE: ${AI_MODE:-rules}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      GOOGLE_GEMINI_MODEL: ${GOOGLE_GEMINI_MODEL:-gemini-3.1-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
    ports:
      - "8080:8080"
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
