services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hangul_detective
      POSTGRES_USER: hangul
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hangul-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangul -d hangul_detective"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hangul_detective
      DATABASE_USERNAME: hangul
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hangul-local}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-123456789}
      CORS_ORIGIN: http://localhost:3000
      AI_MODE: ${AI_MODE:-rules}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres-data:
