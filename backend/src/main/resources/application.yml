server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: hangul-detective-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hangul_detective}
    username: ${DATABASE_USERNAME:hangul}
    password: ${DATABASE_PASSWORD:hangul-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Seoul
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-please-123456789}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  ai:
    mode: ${AI_MODE:rules}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6-astra}
