server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: hangul-detective-api
  datasource:
    url: ${SUPABASE_JDBC_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Seoul
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-please-123456789}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  ai:
    mode: ${AI_MODE:rules}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6-astra}
    gemini-api-key: ${GOOGLE_GEMINI_API_KEY:}
    gemini-model: ${GOOGLE_GEMINI_MODEL:gemini-3.1-flash-lite}
  google-vision-api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
