<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11138c" />
  <meta name="description" content="내 글이 나만의 맞춤 문제집이 되는 한글 탐정단" />
  <title>한글 탐정단 | 오늘의 탐정 수첩</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    :root{--blue:#11138c;--blue2:#2225b5;--ink:#17213d;--muted:#778098;--line:#e9edf4;--green:#45b878;--yellow:#ffe557;--paper:#fff;--bg:#f8f9fc;--pink:#ffedf0}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #83a7ff;outline-offset:3px}.top{height:88px;border-bottom:1px solid #f0f1f4;display:flex;align-items:center;justify-content:center;position:relative;padding:0 7vw}.brand{font-weight:900;color:var(--blue);font-size:22px;display:flex;align-items:center;gap:10px}.mark{width:25px;height:25px;background:var(--green);clip-path:polygon(0 0,62% 0,100% 50%,62% 100%,0 100%,37% 50%)}.top-links{position:absolute;right:7vw;top:16px;display:flex;gap:20px;color:#969baa;font-size:13px}.top-links button{background:none;color:inherit;padding:0}.nav{height:65px;display:flex;justify-content:center;align-items:center;gap:clamp(28px,8vw,150px);font-size:18px;font-weight:700;border-bottom:1px solid #f5f5f7}.nav button{background:none;color:#555d6c;padding:10px 4px}.nav button.active{color:var(--blue);box-shadow:inset 0 -3px var(--blue)}main{max-width:1500px;margin:0 auto;padding:45px 5vw 70px}.hero-wrap{height:440px;position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto 56px}.side-card{position:absolute;width:29%;height:330px;border-radius:34px;display:flex;align-items:center;padding:42px 34px;color:white;overflow:hidden}.side-card.left{left:2%;background:linear-gradient(135deg,#34704c,#124a31);justify-content:flex-start}.side-card.right{right:2%;background:linear-gradient(145deg,#d7e0e7,#c0cad4);color:#243965;justify-content:flex-end;text-align:right}.side-card h2{font-size:24px;line-height:1.45;max-width:240px;margin:12px 0}.side-card .emoji{font-size:42px}.main-banner{position:relative;z-index:2;width:68%;height:100%;border-radius:48px;background:var(--blue);color:white;padding:55px 5.5%;display:flex;align-items:center;justify-content:space-between;overflow:hidden;box-shadow:0 14px 45px #11138c18}.banner-copy{max-width:62%;z-index:1}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.02em;color:#c4d3ff;display:flex;align-items:center;gap:8px}.eyebrow .mark{width:17px;height:17px}.banner-title{font-size:clamp(30px,3.5vw,53px);letter-spacing:-.05em;line-height:1.22;margin:28px 0 8px;font-weight:900}.banner-title span{color:var(--yellow)}.banner-sub{color:#ced4ff;font-size:17px;line-height:1.6}.badge{margin-top:25px;color:#aeb7f0;font-size:12px}.detective{font-size:clamp(90px,12vw,170px);filter:drop-shadow(0 12px 12px #07085366);transform:rotate(-7deg);z-index:1}.banner-controls{position:absolute;left:5.5%;bottom:26px;display:flex;align-items:center;gap:12px}.pill-control,.plus-control{height:54px;border-radius:28px;background:#292b9c;color:white;padding:0 18px;display:flex;align-items:center;gap:11px;font-size:15px}.plus-control{width:54px;justify-content:center;font-size:28px;padding:0}.shortcuts{display:flex;justify-content:center;gap:clamp(24px,4vw,70px);flex-wrap:wrap}.shortcut{width:92px;background:none;color:#51596a;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;font-weight:700}.shortcut-icon{height:67px;width:67px;border-radius:24px;background:#f3f5fa;display:grid;place-items:center;color:var(--blue);font-size:29px;transition:.2s}.shortcut:hover .shortcut-icon{transform:translateY(-4px);background:#eaedff}.section-head{display:flex;align-items:end;justify-content:space-between;margin:18px 0 20px}.section-head h1,.section-head h2{margin:0;font-size:27px}.section-head p{margin:7px 0 0;color:var(--muted)}.content{max-width:1100px;margin:0 auto}.welcome{display:flex;align-items:center;justify-content:space-between;background:#f5f6ff;border-radius:24px;padding:25px 30px;margin-bottom:22px}.welcome h1{margin:0 0 6px;font-size:25px}.welcome p{margin:0;color:var(--muted)}.avatar{height:60px;width:60px;border-radius:50%;background:#ffefbd;display:grid;place-items:center;font-size:32px}.progress-card,.panel{border:1px solid var(--line);border-radius:22px;padding:25px;background:white;margin-bottom:20px}.progress-top{display:flex;justify-content:space-between;align-items:center;font-weight:800}.progress-track{height:10px;background:#eef0f6;border-radius:20px;margin:16px 0 10px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#55cb8b,#f7d84d);border-radius:20px;transition:.3s}.muted{color:var(--muted);font-size:14px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.step{min-height:158px;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.step.done{background:#f3fbf6;border-color:#d7f2e1}.step-number{color:#9098aa;font-size:13px;font-weight:700}.step h3{margin:9px 0;font-size:18px}.step p{font-size:13px;color:var(--muted);margin:0}.btn{background:var(--blue);color:white;border-radius:15px;padding:14px 20px;font-size:15px;font-weight:800;box-shadow:0 6px 14px #11138c22}.btn:hover{background:#2023b2;transform:translateY(-1px)}.btn:disabled{background:#b9bed2;box-shadow:none;cursor:not-allowed}.btn.secondary{background:#eef0ff;color:var(--blue);box-shadow:none}.btn.green{background:#38ae72;box-shadow:none}.btn.small{padding:10px 14px;border-radius:12px}.question-card{max-width:780px;margin:25px auto;background:white;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 14px 45px #1e2b4c0b}.qtop{display:flex;justify-content:space-between;color:var(--muted);font-weight:700}.qprogress{height:7px;background:#eff1f6;border-radius:9px;margin:14px 0 30px}.qprogress span{height:100%;display:block;background:var(--green);border-radius:9px}.qcategory{display:inline-block;background:#eef0ff;color:var(--blue);padding:8px 12px;border-radius:20px;font-size:13px;font-weight:800}.question{font-family:'Gowun Dodum',sans-serif;font-size:clamp(25px,4vw,36px);line-height:1.6;margin:23px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid var(--line);border-radius:17px;padding:16px;background:white;font-size:19px;font-weight:700;color:var(--ink)}.choice:hover{border-color:#8b91e5;background:#f8f8ff}.choice.selected{border-color:var(--blue);background:#f0f1ff}.choice.correct{border-color:#54c182;background:#effaf3}.choice.wrong{border-color:#ffc3c9;background:#fff6f7}.feedback{padding:13px 16px;background:#f1faf4;border-radius:14px;color:#257745;font-weight:700;margin:17px 0}.row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:25px}.textarea{width:100%;min-height:230px;border:2px solid #e8ebf3;border-radius:18px;padding:20px;font-size:19px;line-height:1.75;resize:vertical}.textarea:focus{border-color:#999de9;outline:none}.write-tools{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0;color:var(--muted);font-size:14px}.example-btn{border:0;background:#fff8dc;border-radius:12px;color:#715e15;padding:10px 14px;font-weight:700}.error-list{display:grid;gap:15px;margin-top:22px}.error-item{border:1px solid var(--line);border-radius:18px;padding:19px}.error-token{background:#fff0c9;border-radius:6px;padding:2px 6px}.answer-row{display:flex;gap:9px;margin-top:12px}.answer-row input{flex:1;min-width:0;border:2px solid #e9ebf1;border-radius:12px;padding:12px;font-size:17px}.hint-box{margin-top:12px;padding:12px 15px;border-radius:13px;background:#f1f2ff;color:#3a3d9e}.dashboard{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:17px;padding:18px 15px}.stat label{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:10px}.bar-row{display:grid;grid-template-columns:92px 1fr 44px;gap:12px;align-items:center;margin:18px 0;font-weight:700;font-size:14px}.bar{height:12px;background:#eff1f6;border-radius:10px;overflow:hidden}.bar i{display:block;background:#5dbe88;height:100%;border-radius:10px}.bar-row:nth-child(3) i{background:#767ce0}.bar-row:nth-child(4) i{background:#f4c653}.mistake-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f0f1f5}.summary{background:#f4f5ff;border-radius:17px;padding:20px;line-height:1.8;color:#414c74}.parent-switch{display:flex;background:#f2f3f8;padding:4px;border-radius:12px;gap:4px}.parent-switch button{padding:9px 13px;border-radius:9px;background:transparent;color:#6f7688;font-weight:700}.parent-switch button.on{background:white;color:var(--blue);box-shadow:0 2px 6px #15204712}.hidden{display:none!important}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#17213d;color:white;border-radius:15px;padding:14px 20px;z-index:20;box-shadow:0 8px 30px #10172944;animation:pop .2s ease}@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}.footer{max-width:1100px;margin:40px auto 0;border-top:1px solid var(--line);padding-top:20px;color:#949bac;font-size:12px;display:flex;justify-content:space-between}
    @media(max-width:760px){.top{height:74px}.top-links{right:18px;top:10px;font-size:11px}.brand{font-size:19px}.nav{height:56px;gap:20px;font-size:14px;justify-content:space-around}.nav button{padding:8px 0}main{padding:24px 16px 50px}.hero-wrap{height:350px;margin-bottom:38px}.main-banner{width:94%;height:92%;border-radius:30px;padding:33px 24px;align-items:flex-start}.banner-copy{max-width:75%}.banner-title{font-size:30px;margin:26px 0 10px}.banner-sub{font-size:13px}.badge{font-size:10px}.detective{font-size:74px;position:absolute;right:14px;bottom:54px}.banner-controls{left:24px;bottom:16px}.side-card{width:30%;height:260px;padding:15px;border-radius:22px;opacity:.88}.side-card h2{font-size:16px}.side-card .emoji{font-size:30px}.shortcuts{gap:16px 20px}.shortcut{font-size:12px;width:78px}.shortcut-icon{height:56px;width:56px;border-radius:19px;font-size:24px}.welcome{padding:20px}.welcome h1{font-size:21px}.steps{grid-template-columns:1fr}.step{min-height:130px}.dashboard{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.question-card{padding:23px 19px}.choices{grid-template-columns:1fr}.question{font-size:25px}.footer{flex-direction:column;gap:7px}.section-head h1,.section-head h2{font-size:23px}}
  </style>
</head>
<body>
  <header class="top"><div class="top-links"><button id="noticeBtn">공지사항</button><button id="parentEntry">보호자 모드</button></div><div class="brand"><span class="mark"></span>한글 탐정단</div></header>
  <nav class="nav" id="mainNav"><button data-page="home" class="active">오늘의 수첩</button><button data-page="questions">맞춤 문제</button><button data-page="write">자유 글쓰기</button><button data-page="parent">탐정 보고서</button></nav>
  <main id="app"></main>
  <script>
  (()=>{
    const app=document.querySelector('#app');
    const seed={student:{name:'민수',grade:2},completed:{},questionsDone:0,writings:[],errors:[],lastWrite:null,activePage:'home'};
    let state;try{state={...seed,...JSON.parse(localStorage.getItem('hangul-detective')||'{}')}}catch{state={...seed}}
    state.student={...seed.student,...state.student}; state.completed=state.completed||{};state.writings=state.writings||[];state.errors=state.errors||[];
    const save=()=>localStorage.setItem('hangul-detective',JSON.stringify(state));
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const go=page=>{state.activePage=page;save();render()};
    const today=()=>new Date().toISOString().slice(0,10);
    const setDone=(key)=>{state.completed[key]=true;save()};
    const weekly=()=>{let d=new Set(state.writings.map(x=>x.date));return Math.min(7,Math.max(d.size, Object.keys(state.completed).length?Math.min(4,Object.keys(state.completed).length):0))};
    const questions=[
      {category:'띄어쓰기',text:'나는 학교에 ___ 친구를 만났어요.',choices:['가서','가 서'],answer:'가서',explain:'‘학교에’와 ‘가서’는 각각 뜻을 가진 말이에요. 이 문장에서는 자연스럽게 이어 써요.'},
      {category:'발음과 표기',text:'친구와 ___ 놀았어요.',choices:['가치','같이'],answer:'같이',explain:'‘함께’라는 뜻으로 쓸 때는 ‘같이’예요.'},
      {category:'받침',text:'비가 오니까 우산을 ___ 가요.',choices:['갖고','갇고'],answer:'갖고',explain:'‘가지고’라는 뜻의 ‘갖고’에는 ㅈ 받침이 들어가요.'},
      {category:'돼 / 되',text:'오늘은 숙제를 다 해도 ___요.',choices:['되요','돼요'],answer:'돼요',explain:'‘되어요’로 바꿔 말할 수 있으니 ‘돼요’가 맞아요.'},
      {category:'띄어쓰기',text:'집에 ___ 손을 씻었어요.',choices:['와서','와 서'],answer:'와서',explain:'‘와서’는 ‘오다’에 ‘-아서’가 붙은 말이라 이어 써요.'}
    ];
    let qIndex=0,qSelected='',qChecked=false;
    const nav=()=>document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.activePage));
    function home(){const done=Object.keys(state.completed).length, pct=Math.min(100,Math.round(done/3*100));return `<div class="hero-wrap"><article class="side-card left"><div><div class="emoji">🕵️</div><h2>오늘도 한글 단서를<br>찾아볼까요?</h2><b>탐정 배지 모으기</b></div></article><article class="main-banner"><div class="banner-copy"><div class="eyebrow"><span class="mark"></span>한글 탐정단 · 오늘의 수첩</div><div class="banner-title">내 글이 곧<br><span>나만의 문제집!</span></div><div class="banner-sub">찾고, 생각하고, 다시 쓰며<br>한글 실력이 쑥쑥 자라나요.</div><div class="badge">탐정 ${esc(state.student.name)} · 초${state.student.grade}학년</div></div><div class="detective">🕵️‍♀️</div><div class="banner-controls"><button class="pill-control" id="startToday">〈 &nbsp;오늘의 학습 시작&nbsp; ›</button><button class="plus-control" id="profileBtn" title="탐정 프로필">＋</button></div></article><article class="side-card right"><div><div class="emoji">📚</div><h2>한 걸음씩 모으면<br>실력이 돼요!</h2><b>오늘도 10분 탐정 활동</b></div></article></div><div class="shortcuts"><button class="shortcut" data-go="questions"><span class="shortcut-icon">✏️</span>맞춤 문제</button><button class="shortcut" data-go="write"><span class="shortcut-icon">📝</span>자유 글쓰기</button><button class="shortcut" data-go="parent"><span class="shortcut-icon">📊</span>탐정 보고서</button><button class="shortcut" id="resetBtn"><span class="shortcut-icon">🔄</span>오늘 기록 보기</button></div>`}
    function todayPage(){const n=Object.keys(state.completed).length;return `<div class="content"><div class="welcome"><div><h1>안녕, ${esc(state.student.name)} 탐정! 👋</h1><p>오늘도 한글 단서를 찾아볼까요?</p></div><div class="avatar">🕵️</div></div><section class="progress-card"><div class="progress-top"><span>오늘의 탐정 미션</span><span>${Math.min(n,3)} / 3 완료</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(n,3)/3*100}%"></div></div><span class="muted">${n>=3?'오늘의 미션을 모두 해냈어요! 멋져요 🎉':'조금씩 해도 괜찮아요. 한 가지씩 해봐요!'}</span></section><div class="steps"><div class="step ${state.completed.questions?'done':''}"><div><span class="step-number">미션 1 ${state.completed.questions?'✓':''}</span><h3>맞춤 문제 5개</h3><p>오늘의 한글 단서를 찾아요</p></div><button class="btn small" data-go="questions">${state.completed.questions?'다시 풀기':'문제 풀기'}</button></div><div class="step ${state.completed.write?'done':''}"><div><span class="step-number">미션 2 ${state.completed.write?'✓':''}</span><h3>자유 글쓰기</h3><p>무엇이든 편하게 써봐요</p></div><button class="btn small" data-go="write">${state.completed.write?'글 더 쓰기':'글쓰기'}</button></div><div class="step ${state.completed.review?'done':''}"><div><span class="step-number">미션 3 ${state.completed.review?'✓':''}</span><h3>오늘의 다시 쓰기</h3><p>내가 쓴 글 속 단서를 찾아요</p></div><button class="btn small" data-go="review">${state.completed.review?'복습 완료':'복습하기'}</button></div></div><div style="text-align:center;margin-top:23px"><button class="btn secondary" data-go="parent">보호자용 탐정 보고서 보기</button></div></div>`}
    function questionPage(){const q=questions[qIndex];return `<div class="content"><div class="section-head"><div><h1>오늘의 맞춤 문제</h1><p>천천히 읽고, 알맞은 답을 골라봐요.</p></div><span class="qcategory">탐정 문제</span></div><div class="question-card"><div class="qtop"><span>문제 ${qIndex+1} / ${questions.length}</span><span>${esc(q.category)}</span></div><div class="qprogress"><span style="width:${(qIndex+1)/questions.length*100}%"></span></div><div class="qcategory">${esc(q.category)} 단서</div><div class="question">${esc(q.text)}</div><div class="choices">${q.choices.map(c=>`<button class="choice ${qSelected===c?'selected':''} ${qChecked?(c===q.answer?'correct':qSelected===c?'wrong':''):''}" data-choice="${esc(c)}" ${qChecked?'disabled':''}>${esc(c)}</button>`).join('')}</div>${qChecked?`<div class="feedback">${qSelected===q.answer?'정답이에요!':'거의 맞았어요. 정답은 '+esc(q.answer)+'예요.'} ${esc(q.explain)}</div>`:''}<div class="row-actions"><button class="btn secondary" id="exitQuestions">나중에 하기</button><button class="btn" id="questionNext" ${!qSelected?'disabled':''}>${qChecked?(qIndex===4?'마무리':'다음 문제'):'정답 확인'}</button></div></div></div>`}
    function writePage(){return `<div class="content"><div class="section-head"><div><h1>자유 글쓰기</h1><p>오늘 있었던 일, 좋아하는 것… 무엇이든 써봐요.</p></div><span class="qcategory">글감 자유</span></div><div class="panel"><label for="story" style="font-size:18px;font-weight:800">탐정 수첩에 내 이야기를 적어봐요 ✨</label><textarea id="story" class="textarea" placeholder="오늘 어떤 일이 있었나요? 생각나는 대로 써봐요!">${esc(window.draftText||'')}</textarea><div class="write-tools"><span id="charCount">0자 · 짧은 글도 좋아요</span><button class="example-btn" id="exampleBtn">예시 문장 넣기</button></div><div class="row-actions"><button class="btn secondary" data-go="today">돌아가기</button><button class="btn" id="analyzeBtn">단서 찾기</button></div></div><div id="analysis"></div></div>`}
    const rules=[{re:/가치(?=\s*놀)/g,correct:'같이',category:'발음과 표기',hint1:'친구와 무엇을 했나요? ‘함께’라는 뜻의 말이에요.',hint2:'‘같’으로 시작해요.',choices:['가치','같이','갇이']},{re:/집에와서/g,correct:'집에 와서',category:'띄어쓰기',hint1:'‘집에’와 ‘와서’를 나누어 생각해보세요.',hint2:'‘집에’ 뒤를 한 칸 띄워요.',choices:['집에와서','집에 와서','집에 와 써']},{re:/학교에갔다/g,correct:'학교에 갔다',category:'띄어쓰기',hint1:'‘학교에’와 ‘갔다’를 나누어 생각해보세요.',hint2:'가운데 한 칸을 띄워요.',choices:['학교에갔다','학교에 갔다','학교 에갔다']},{re:/되요/g,correct:'돼요',category:'돼 / 되',hint1:'‘되어요’로 바꿀 수 있는지 살펴봐요.',hint2:'‘되어요’를 줄이면 두 글자가 돼요.',choices:['되요','돼요','됬요']}];
    function analyze(text){let found=[];rules.forEach(rule=>{for(const m of text.matchAll(rule.re)){found.push({...rule,original:m[0],start:m.index,attempts:0,hint:0,solved:false})}});return found.sort((a,b)=>a.start-b.start)}
    function reviewPage(){const w=state.lastWrite;if(!w)return `<div class="content"><div class="section-head"><div><h1>오늘의 다시 쓰기</h1><p>아직 살펴볼 글이 없어요.</p></div></div><div class="panel" style="text-align:center;padding:50px"><div style="font-size:56px">📓</div><h2>먼저 자유 글쓰기를 해볼까요?</h2><button class="btn" data-go="write">글쓰기 시작</button></div></div>`;const errors=w.errors||[];return `<div class="content"><div class="section-head"><div><h1>내 글의 단서 찾기</h1><p>정답을 바로 알려주지 않을게요. 직접 다시 써봐요!</p></div><span class="qcategory">${errors.filter(e=>e.solved).length} / ${errors.length} 해결</span></div><div class="panel"><div style="font-size:17px;line-height:1.9">${highlight(w.text,errors)}</div></div>${errors.length?`<div class="error-list">${errors.map((e,i)=>`<div class="error-item"><div><span class="qcategory">${esc(e.category)}</span><p style="font-size:17px;font-weight:800;margin:13px 0">“${esc(e.original)}” 부분을 다시 생각해 써볼까요?</p></div>${e.solved?`<div class="feedback">잘 고쳤어요! 직접 단서를 찾았네요 🎉</div>`:`<div class="answer-row"><input id="answer${i}" placeholder="바르게 고쳐 써보기" aria-label="${esc(e.original)} 고쳐 쓰기"><button class="btn small" data-check="${i}">확인</button><button class="btn small secondary" data-hint="${i}">힌트 보기</button></div>${e.hint?`<div class="hint-box">💡 ${esc(e.hint===1?e.hint1:e.hint===2?e.hint2:'보기: '+e.choices.join(' · '))}</div>`:''}<div class="muted" style="margin-top:8px">다시 도전 ${e.attempts}회 · 힌트 ${e.hint}단계</div>`}</div>`).join('')}</div>`:`<div class="panel" style="text-align:center"><div style="font-size:50px">🌟</div><h2>찾을 단서가 없어요!</h2><p>글을 멋지게 썼네요. 다음에도 편하게 써봐요.</p></div>`}<div class="row-actions"><button class="btn secondary" data-go="write">글 더 쓰기</button><button class="btn green" id="finishReview">${errors.every(e=>e.solved)?'오늘 복습 마치기':'다 했어요'}</button></div></div>`}
    function highlight(text,errors){if(!errors.length)return esc(text);let out='',pos=0;for(const e of errors){let i=text.indexOf(e.original,pos);if(i<0)continue;out+=esc(text.slice(pos,i))+`<mark class="error-token">${esc(e.original)}</mark>`;pos=i+e.original.length}return out+esc(text.slice(pos))}
    function parentPage(){const errs=state.errors;const cats={};errs.forEach(e=>{if(!e.solved)cats[e.category]=(cats[e.category]||0)+1});const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const spacing=state.writings.reduce((n,w)=>n+(w.errors||[]).filter(e=>e.category==='띄어쓰기').length,0);const spelling=state.writings.reduce((n,w)=>n+(w.errors||[]).filter(e=>e.category!=='띄어쓰기').length,0);const accuracy=(total,wrong)=>total?Math.round((total/(total+wrong))*100):100;const summary=sorted.length?`이번에는 ${sorted[0][0]} 단서를 자주 만났어요. 틀린 곳을 직접 다시 쓰며 연습하고 있어요. 다음 학습에서도 ${sorted[0][0]} 문제를 조금 더 연습할게요.`:'꾸준히 탐정 활동을 이어가고 있어요. 자유 글쓰기에서 새로운 단서를 모으면 맞춤 문제를 더 잘 골라줄게요.';return `<div class="content"><div class="section-head"><div><h1>보호자 탐정 보고서</h1><p>${esc(state.student.name)} · 초등학교 ${state.student.grade}학년 · 이번 주 학습을 살펴봐요</p></div><div class="parent-switch"><button class="on">이번 주</button><button id="editProfile">프로필</button></div></div><div class="stats"><div class="stat"><label>이번 주 학습일</label><strong>${weekly()}일</strong></div><div class="stat"><label>작성한 글</label><strong>${state.writings.length}개</strong></div><div class="stat"><label>맞춤법 정확도</label><strong>${accuracy(10,spelling)}%</strong></div><div class="stat"><label>띄어쓰기 정확도</label><strong>${accuracy(10,spacing)}%</strong></div></div><div class="dashboard" style="margin-top:20px"><section class="panel"><h2 style="margin:0 0 20px">약점 영역</h2>${['띄어쓰기','발음과 표기','받침'].map(c=>{let n=cats[c]||0;return `<div class="bar-row"><span>${c}</span><div class="bar"><i style="width:${Math.max(12,Math.min(100,n*22))}%"></i></div><span>${n?`오답 ${n}`:'좋아요'}</span></div>`}).join('')}<div class="muted" style="margin-top:21px">반복해서 틀린 유형은 다음 맞춤 문제에 더 많이 반영돼요.</div></section><section class="panel"><h2 style="margin:0 0 12px">최근 반복 실수</h2>${errs.length?errs.slice(-4).reverse().map(e=>`<div class="mistake-row"><span>${esc(e.original)} → ${e.solved?esc(e.correct):'다시 연습 중'}</span><b>${e.attempts||1}회</b></div>`).join(''):'<p class="muted">글을 쓰면 자주 만나는 단서가 여기에 보여요.</p>'}</section><section class="panel"><h2 style="margin:0 0 15px">이번 주 한 줄 요약</h2><div class="summary">“${summary}”</div><p class="muted" style="margin-bottom:0">실제 학습 기록을 바탕으로 만든 요약이에요.</p></section><section class="panel"><h2 style="margin:0 0 12px">최근 학습</h2>${state.writings.length?state.writings.slice(-3).reverse().map(w=>`<div class="mistake-row"><span>${esc(w.date)} · 자유 글쓰기</span><b>${(w.errors||[]).length}개 단서</b></div>`).join(''):'<p class="muted">아직 기록이 없어요. 첫 글쓰기를 시작해볼까요?</p>'}</section></div><div style="text-align:center"><button class="btn secondary" data-go="today">학생 화면으로 돌아가기</button></div></div>`}
    function render(){nav();const pages={home,today:todayPage,questions:questionPage,write:writePage,review:reviewPage,parent:parentPage};app.innerHTML=(pages[state.activePage]||home)();bind();}
    function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2400)}
    function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('#mainNav [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page==='home'?'today':b.dataset.page));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(qChecked)return;qSelected=b.dataset.choice;render()});const next=document.querySelector('#questionNext');if(next)next.onclick=()=>{if(!qChecked){qChecked=true;if(qSelected===questions[qIndex].answer)state.questionsDone++;save();render();return}if(qIndex<4){qIndex++;qSelected='';qChecked=false;render()}else{setDone('questions');go('today');toast('맞춤 문제를 모두 풀었어요!')}};const exit=document.querySelector('#exitQuestions');if(exit)exit.onclick=()=>go('today');
      const story=document.querySelector('#story');if(story){story.oninput=()=>{window.draftText=story.value;document.querySelector('#charCount').textContent=`${story.value.length}자 · 짧은 글도 좋아요`};document.querySelector('#exampleBtn').onclick=()=>{story.value='오늘 친구랑 가치 놀았다. 집에와서 밥을 먹었다.';story.dispatchEvent(new Event('input'))};document.querySelector('#analyzeBtn').onclick=()=>{const text=story.value.trim();if(!text){toast('한 문장만 적어도 좋아요!');story.focus();return}const errors=analyze(text);const writing={id:Date.now(),text,errors,date:today(),inputType:'KEYBOARD'};state.lastWrite=writing;state.writings.push(writing);state.errors.push(...errors);setDone('write');save();window.draftText='';if(errors.length)go('review');else{go('review');toast('멋진 글이에요! 찾을 단서가 없어요.')}}}
      document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=+b.dataset.check,w=state.lastWrite,e=w.errors[i],input=document.querySelector(`#answer${i}`),answer=input.value.trim().replace(/\s+/g,' ');e.attempts++;if(answer===e.correct){e.solved=true;toast('정답이에요! 스스로 잘 찾아냈어요 🎉')}else toast('거의 맞았어요. 힌트를 보고 한 번 더 해봐요!');save();render()});document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{let e=state.lastWrite.errors[+b.dataset.hint];e.hint=Math.min(3,e.hint+1);save();render()});const finish=document.querySelector('#finishReview');if(finish)finish.onclick=()=>{setDone('review');go('today');toast('오늘의 탐정 활동을 기록했어요!')};
      const profile=document.querySelector('#profileBtn')||document.querySelector('#editProfile');if(profile)profile.onclick=()=>{const name=prompt('탐정 이름을 알려주세요.',state.student.name);if(name&&name.trim()){state.student.name=name.trim().slice(0,12);const grade=prompt('몇 학년인가요? (1~3)',String(state.student.grade));if(['1','2','3'].includes(grade))state.student.grade=Number(grade);save();render()}};const start=document.querySelector('#startToday');if(start)start.onclick=()=>go('today');const notice=document.querySelector('#noticeBtn');if(notice)notice.onclick=()=>toast('한글 탐정단에 오신 걸 환영해요!');const reset=document.querySelector('#resetBtn');if(reset)reset.onclick=()=>toast(`지금까지 ${state.writings.length}개의 글을 썼어요!`)}
    document.querySelector('#parentEntry').onclick=()=>go('parent');document.querySelectorAll('#mainNav [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page==='home'?'today':b.dataset.page));render();
  })();
  </script>
</body>
</html>
